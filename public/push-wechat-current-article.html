<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同步公众号草稿箱</title>
</head>
<body style="margin:0;background:#ffffff;color:#333333;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <main style="max-width:640px;margin:0 auto;padding:42px 20px;">
    <p style="margin:0 0 10px;color:#6B8A62;font-size:14px;line-height:1.6;">陈七七77 · 公众号草稿同步</p>
    <h1 style="margin:0 0 18px;color:#333333;font-size:28px;line-height:1.36;">同步当前文章到公众号草稿箱</h1>
    <p style="margin:0 0 24px;color:#666A6D;font-size:16px;line-height:1.85;">先上传封面，或者粘贴已有封面素材 ID；再点击同步。同步成功后，请到公众号后台预览、检查封面和合规表达，再决定是否发布。</p>

    <section style="margin:0 0 28px;padding:0;">
      <label style="display:block;margin:0 0 10px;color:#333333;font-size:16px;font-weight:700;">封面图</label>
      <input id="coverInput" type="file" accept="image/png,image/jpeg,image/jpg" style="display:block;margin:0 0 12px;color:#333333;font-size:15px;">
      <button id="uploadButton" style="display:inline-block;border:0;border-radius:10px;background:#6B8A62;color:#ffffff;font-size:15px;font-weight:700;line-height:1;padding:13px 18px;cursor:pointer;">上传封面到公众号素材库</button>
      <p style="margin:14px 0 8px;color:#666A6D;font-size:14px;line-height:1.7;">如果你已经有封面素材 ID，也可以直接粘贴：</p>
      <input id="mediaIdInput" type="text" placeholder="thumb_media_id / media_id" style="box-sizing:border-box;width:100%;border:1px solid #E1E8DE;border-radius:10px;padding:12px 14px;color:#333333;font-size:15px;line-height:1.5;">
    </section>

    <button id="pushButton" style="display:inline-block;border:0;border-radius:10px;background:#5F7D57;color:#ffffff;font-size:16px;font-weight:700;line-height:1;padding:15px 22px;cursor:pointer;">同步到公众号草稿箱</button>
    <p id="status" style="margin:22px 0 0;color:#666A6D;font-size:15px;line-height:1.8;"></p>
  </main>
  <script>
    const coverInput = document.getElementById("coverInput");
    const uploadButton = document.getElementById("uploadButton");
    const mediaIdInput = document.getElementById("mediaIdInput");
    const pushButton = document.getElementById("pushButton");
    const status = document.getElementById("status");

    uploadButton.addEventListener("click", async () => {
      const file = coverInput.files && coverInput.files[0];
      if (!file) {
        status.textContent = "请先选择一张封面图。";
        return;
      }

      uploadButton.disabled = true;
      uploadButton.textContent = "正在上传...";
      status.textContent = "正在上传封面到公众号素材库。";

      try {
        const formData = new FormData();
        formData.set("cover", file);
        const response = await fetch("/api/wechat/upload-cover", {
          method: "POST",
          body: formData,
        });
        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.message || "上传封面失败");
        }

        mediaIdInput.value = data.mediaId;
        status.textContent = `封面上传成功，已填入素材 ID：${data.mediaId}`;
        uploadButton.textContent = "封面已上传";
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : "上传封面失败。";
        uploadButton.disabled = false;
        uploadButton.textContent = "重新上传封面";
      }
    });

    pushButton.addEventListener("click", async () => {
      const thumbMediaId = mediaIdInput.value.trim();
      if (!thumbMediaId) {
        status.textContent = "请先上传封面，或粘贴已有封面素材 ID。";
        return;
      }

      pushButton.disabled = true;
      pushButton.textContent = "正在同步...";
      status.textContent = "正在创建公众号草稿，请稍等。";

      try {
        const response = await fetch("/api/wechat/push-current-article", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ thumbMediaId }),
        });
        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.message || "同步失败");
        }

        status.textContent = `同步成功，可到公众号草稿箱查看。草稿 media_id：${data.mediaId}`;
        pushButton.textContent = "已同步";
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : "同步失败，请检查配置。";
        pushButton.disabled = false;
        pushButton.textContent = "重新同步";
      }
    });
  </script>
</body>
</html>
